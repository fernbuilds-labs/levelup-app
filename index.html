<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Level Up: a free habit tracker with a daily schedule, streaks, XP and reports. No account; your data stays on your phone.">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Level Up">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Level Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Today is home (ring + Now card + grouped habits + logs), then Habits grid, Analytics, Edit, Sync. Bottom tab bar on phones, top tabs on wide screens. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#1A1D29; --muted:#5E6378; --faint:#8A8FA3; --line:#DCDFE8; --track:#ECEEF3;
  --accent:#3B3FB8; --accent-soft:#E4E5FA; --done:#23935A; --done-ink:#FFFFFF; --done-soft:#CDEBD9;
  --miss:#C8402F; --miss-soft:#FBE7E3; --skip:#A87612; --skip-soft:#FBF1DC;
  --h0:#ECEEF3; --h1:#BFE5CD; --h2:#7FCB9C; --h3:#3FA86B; --h4:#1E7A47;
  --g-morning:#C98A1E; --g-body:#2F7D6D; --g-craft:#8A4FC4; --g-night:#3B6FD6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141C; --surface:#1A1D28; --ink:#E8EAF2; --muted:#9AA0B6; --faint:#737A93; --line:#2C3042; --track:#242838;
  --accent:#8F93FF; --accent-soft:#2A2D55; --done:#3DB774; --done-ink:#0E1A13; --done-soft:#1F4A33;
  --miss:#EE6F5C; --miss-soft:#3A2224; --skip:#E0B04A; --skip-soft:#3A3020;
  --h0:#242838; --h1:#1F4A33; --h2:#2A6E48; --h3:#3A9A62; --h4:#5DCB8A;
  --g-morning:#E0A63A; --g-body:#3FA48F; --g-craft:#A876E0; --g-night:#5E8FEF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141C; --surface:#1A1D28; --ink:#E8EAF2; --muted:#9AA0B6; --faint:#737A93; --line:#2C3042; --track:#242838;
  --accent:#8F93FF; --accent-soft:#2A2D55; --done:#3DB774; --done-ink:#0E1A13; --done-soft:#1F4A33;
  --miss:#EE6F5C; --miss-soft:#3A2224; --skip:#E0B04A; --skip-soft:#3A3020;
  --h0:#242838; --h1:#1F4A33; --h2:#2A6E48; --h3:#3A9A62; --h4:#5DCB8A;
  --g-morning:#E0A63A; --g-body:#3FA48F; --g-craft:#A876E0; --g-night:#5E8FEF; color-scheme:dark}
html{height:100%;background:linear-gradient(var(--bg) 50%,var(--surface) 50%)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;height:100%;overflow:hidden}
.app{display:flex;flex-direction:column;height:100%}
.scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.wrap{max-width:1000px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(22px,4.5vw,30px);line-height:1.1}
h2{font-size:19px}
h3{font-size:15.5px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip.ok .dot{background:var(--done)} .chip.warn .dot{background:var(--miss)}
nav.tabs{flex:none;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:calc(100% - 32px);margin:12px auto 0}
nav.tabs a{text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:7px 13px;border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs a svg{display:none}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--surface)}
@media (max-width:760px){
  nav.tabs{order:2;width:auto;max-width:none;margin:0;border-radius:0;border-width:1px 0 0;justify-content:space-around;padding-block:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .wrap{padding-block:14px 24px}
  nav.tabs a{font-size:11px;padding:4px 6px;flex:1}
  nav.tabs a svg{display:block;width:22px;height:22px}
  nav.tabs a[aria-current="page"]{background:transparent;color:var(--accent)}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px 16px}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 16px 6px}
.sub{font-size:12.5px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.nav{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.btn.icon{width:36px;padding:7px 0;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--miss)}
.btn[disabled]{opacity:.4;cursor:default}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.meter{height:7px;border-radius:4px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;background:var(--done);border-radius:4px}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:14px}
.needs{font-size:12.5px;color:var(--muted);background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}

/* today hero */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:16px}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;padding-bottom:10px}
.ring small{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:10.5px;color:var(--muted)}
.nowcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.nowcard{border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;flex-direction:column;gap:3px;background:var(--bg)}
.nowcard .k{font-size:10.5px;color:var(--faint);font-family:var(--f-mono);letter-spacing:.06em}
.nowcard .t{font-weight:600;font-size:15px}
.nowcard .meter{height:5px}.nowcard .meter i{background:var(--accent)}

/* habit list (today) */
.grp{border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.gh{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;font-size:11px;font-family:var(--f-mono);letter-spacing:.06em;color:var(--muted)}
.gh i{width:9px;height:9px;border-radius:50%}
.hl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 12px 7px 16px;min-height:48px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hl .nm{display:flex;flex-direction:column;min-width:0}
.hl .nm span:first-child{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl .nm small{font-size:11.5px;color:var(--faint)}
.hl .nm small b{color:var(--skip);font-weight:600}
.ctl{display:flex;align-items:center;gap:6px}
.tick{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-weight:700;font-size:17px}
.tick.d{background:var(--done);border-color:var(--done);color:var(--done-ink)}
.tick.s{background:var(--skip-soft);border-color:var(--skip);color:var(--skip)}
.tick.m{background:var(--miss-soft);border-color:var(--miss);color:var(--miss)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;font-size:16px}
.step .val{min-width:62px;text-align:center;font-family:var(--f-mono);font-size:12px;line-height:1.2}
.step .val.full{color:var(--done);font-weight:600}
.more{width:30px;height:34px;border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:18px;border-radius:8px}
.streak{font-family:var(--f-mono);font-size:11px;color:var(--g-morning)}

/* logs */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:4px 16px 14px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fields input,.fields select,.ed input,.ed select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-size:14px;width:100%;box-sizing:border-box;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--bg);padding:8px 6px;font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.status{padding:0 16px 14px;font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.pill.ok{background:var(--done-soft);color:var(--done)} .pill.bad{background:var(--miss-soft);color:var(--miss)}

/* schedule */
.blk{display:grid;grid-template-columns:26px 72px minmax(0,1fr);gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line);cursor:pointer}
.blk input{width:20px;height:20px;accent-color:var(--done);cursor:pointer}
.blk .t{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.blk .w{font-size:14px;min-width:0}
.blk .w small{display:block;font-size:11px;color:var(--faint)}
.blk.on .w>span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.blk.cur{background:var(--accent-soft)}
textarea{width:100%;box-sizing:border-box;min-height:84px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:14px/1.5 var(--f-body);padding:12px 16px;resize:vertical;border-radius:0 0 14px 14px}

/* grid */
.gridwrap{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
.grid th,.grid td{padding:0}
.grid thead th{background:var(--surface);padding:10px 0 8px;font-weight:500}
.grid .hn{text-align:left;padding:0 8px 0 14px;font-size:13.5px;font-weight:500;width:190px;border-bottom:1px solid var(--line);background:var(--surface)}
.grid .hn small{display:block;font-size:10.5px;color:var(--faint);font-family:var(--f-mono)}
.grid tr.gr th{text-align:left;padding:10px 14px 4px;font-size:10.5px;font-family:var(--f-mono);letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line)}
.grid tr.gr i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dh{display:flex;flex-direction:column;align-items:center;gap:2px}
.dh small{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--faint)}
.dh b{font-family:var(--f-display);font-size:17px;font-weight:500;width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.dh.today b{background:var(--done);color:var(--done-ink)}
.grid td.c{border-bottom:1px solid var(--line);border-left:1px solid var(--line);height:46px}
.cell{display:grid;place-items:center;width:100%;height:100%;min-height:46px;border:0;background:transparent;cursor:pointer;font-size:14px;font-weight:700;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cell.d{background:var(--done);color:var(--done-ink)}
.cell.s{background:var(--skip-soft);color:var(--skip)}
.cell.m{background:var(--miss-soft);color:var(--miss)}
.cell.p{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--ink)}
.cell.off{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--track) 6px 8px);cursor:default}
.cell[disabled]{cursor:default;opacity:.35}
.grid tfoot td{padding:8px 0}
.score{display:grid;place-items:center}
.score span{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.score span.full{border-color:var(--done);color:var(--done)}
@media (max-width:560px){.grid .hn{width:104px;font-size:12px;padding:0 4px 0 10px;line-height:1.2}.dh b{width:26px;height:26px;font-size:14px}.score span{width:30px;height:30px;font-size:9.5px}.cell{font-size:12px}.cell.p{font-size:9.5px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
@media (min-width:761px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet .acts button{padding:12px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;cursor:pointer}
.sheet .acts .d{border-color:var(--done);color:var(--done)} .sheet .acts .s{border-color:var(--skip);color:var(--skip)} .sheet .acts .m{border-color:var(--miss);color:var(--miss)}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reasons button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.reasons button[aria-pressed="true"]{border-color:var(--skip);background:var(--skip-soft);color:var(--skip)}

/* analytics */
.ranges{display:flex;gap:4px;flex-wrap:wrap}
.ranges button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.ranges button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1}
.tile .s{font-size:11.5px;color:var(--faint)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--faint);font-family:var(--f-mono);font-size:10.5px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:5px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
.heat{overflow-x:auto;padding-bottom:4px}
.heat svg{display:block}
.heatlegend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--faint);font-family:var(--f-mono);justify-content:flex-end;margin-top:6px}
.heatlegend i{width:10px;height:10px;border-radius:2px}
.insight{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:58px 1fr;gap:2px 12px;align-items:center;background:var(--bg)}
.insight .big{font-family:var(--f-display);font-size:22px;font-weight:700;grid-row:span 2;text-align:center}
.insight .big.up{color:var(--done)} .insight .big.down{color:var(--miss)}
.insight p{font-size:13.5px} .insight small{font-size:11.5px;color:var(--faint)}
.tbl{display:flex;flex-direction:column;gap:8px}
.tr{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 44px 44px 50px;gap:8px;align-items:center;font-size:13px}
.tr.h{font-size:10.5px;color:var(--faint);font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.tr .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tr .n i{width:7px;height:7px;border-radius:50%;flex:none}
.tr .x{font-family:var(--f-mono);font-size:11.5px;text-align:right;color:var(--muted)}
.tr .meter{height:8px}
.tr.low .meter i{background:var(--miss)}
@media (max-width:480px){.tr{grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) 38px 34px 40px;gap:6px}}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);width:76px;text-align:center}
.badge .m{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;border:2px solid var(--done);color:var(--done);background:var(--surface)}
.badge.next .m{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.goalrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.goalrow .meter{grid-column:1/-1;height:9px}.goalrow .meter i{background:var(--accent)}
.goalrow small{grid-column:1/-1;font-size:11.5px;color:var(--faint)}
.sk{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(50px,1fr) 38px;gap:8px;align-items:center;font-size:12.5px}
.sk .t{font-family:var(--f-mono);color:var(--muted);font-size:11px}
.sk .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk .meter i{background:var(--miss)}
.sk .v{font-family:var(--f-mono);text-align:right;font-size:11.5px;color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .col{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--bg)}
.duo .k{font-size:11.5px;color:var(--muted)} .duo .v{font-family:var(--f-display);font-size:22px;font-weight:700} .duo .s{font-size:11.5px;color:var(--faint)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:130px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.wk .col{width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.wk small{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.wk .val{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}

/* ---------- storage ---------- */

      ${WZ.rerun?"":`<label class="modrow" style="margin-top:12px;border:1px solid var(--line);border-radius:12px"><span><b>Show me a quick tour</b><span class="sub">Seven short tips on the main screens. Skip any time.</span></span><input type="checkbox" class="sw" id="wzTour"${WZ.tour?" checked":""}></label>`}`}
  const canNext=S!==1||!!WZ.tpl;
  root.innerHTML=`<div class="wiz" id="wizard" role="dialog" aria-modal="true" aria-labelledby="wz-t"><div class="wizcard">
    <div class="wzhead"><span class="lbl">Step ${S+1} of ${N} · ${steps[S]}</span><button class="btn ghost" id="wzSkip">${WZ.rerun?"Cancel":"Skip setup"}</button></div>
    <div class="dots" aria-hidden="true">${steps.map((_,i)=>`<i class="${i<=S?"on":""}"></i>`).join("")}</div>
    <h2 id="wz-t">${title}</h2><p class="sub" style="margin:4px 0 16px;font-size:14px">${sub}</p><div class="wzbody">${body}</div>
    <div class="wzfoot">${S?`<button class="btn" id="wzBack">Back</button>`:"<span></span>"}<button class="btn primary" id="wzNext"${canNext?"":" disabled"}>${S===N-1?(WZ.rerun?"Save changes":"Start"):"Next"}</button></div></div></div>`;
  const $=s=>root.querySelector(s);
  $("#wzSkip").onclick=()=>{if(!WZ.rerun){CFG.setupDone=true;touchCfg()}closeWizard();route()};
  if($("#wzBack"))$("#wzBack").onclick=()=>{WZ.step--;renderWizard()};
  if($("#wzName"))$("#wzName").oninput=ev=>{WZ.name=ev.target.value};
  if($("#wzRestore"))$("#wzRestore").onclick=ev=>{ev.preventDefault();closeWizard();location.hash="#sync"};
  root.querySelectorAll("[data-tpl]").forEach(b=>b.onclick=()=>{if(WZ.tpl!==b.dataset.tpl&&b.dataset.tpl!=="keep")WZ.timesTouched=false;WZ.tpl=b.dataset.tpl;if(WZ.tpl==="keep"){const ws=dayStart()+120;WZ.wake=hhmm(ws%1440);WZ.bed=CFG.sleep.bed;WZ.timesTouched=true}renderWizard();const sel=root.querySelector(`[data-tpl="${WZ.tpl}"]`);sel&&sel.focus()});
  if($("#wzExam"))$("#wzExam").onchange=ev=>{WZ.exam=ev.target.checked;renderWizard()};
  const tChange=()=>{const w=$("#wzWake").value,b=$("#wzBed").value;if(toMin(w)!=null)WZ.wake=w;if(toMin(b)!=null)WZ.bed=b;WZ.timesTouched=true;renderWizard()};
  if($("#wzWake")){$("#wzWake").onchange=tChange;$("#wzBed").onchange=tChange}
  root.querySelectorAll("[data-wmod]").forEach(c=>c.onchange=()=>{WZ.mods[c.dataset.wmod]=c.checked});
  if($("#wzTour"))$("#wzTour").onchange=ev=>{WZ.tour=ev.target.checked};
  $("#wzNext").onclick=()=>{if(S<N-1){WZ.step++;renderWizard();return}
    const tour=WZ.tour&&!WZ.rerun;applySetup(WZ);closeWizard();location.hash="#today";route();toast(tour?"You're set up":"Setup saved");if(tour)setTimeout(()=>startTour(),350)};
  const first=$("#wzName")||root.querySelector('[aria-checked="true"]')||$("#wzNext");try{first.focus({preventScroll:true})}catch(e){}}

/* ---------- feedback (email) ---------- */
function deviceLine(){const ua=navigator.userAgent;const os=/iPhone|iPad|iPod/.test(ua)?"iPhone/iPad":/Android/.test(ua)?"Android":/Mac/.test(ua)?"Mac":/Windows/.test(ua)?"Windows":"Other";
  const inst=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone?"installed app":"browser";return `${os} · ${inst}`}
function openFeedback(){const root=document.getElementById("sheetroot");let type="Idea";
  const types=[["Idea","💡 Idea"],["Bug","🐞 Something's broken"],["Love","❤️ What I like"],["Other","Other"]];
  const mail=()=>{const subj=`Level Up feedback: ${type}`;const body=`\n\n\n— — —\nLevel Up ${APP_VERSION} · ${deviceLine()}\n(Feel free to delete this line.)`;
    return `mailto:${FEEDBACK_EMAIL}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`};
  root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fb-t"><span class="grab"></span>
   <div><h3 id="fb-t">Send feedback</h3><p class="sub" style="margin-top:2px">Bugs, ideas, or what you enjoy. It comes straight to my inbox, and I read every message.</p></div>
   <div class="fbtypes" role="group" aria-label="Type of feedback">${types.map(([k,l])=>`<button data-fbt="${k}" aria-pressed="${k===type}">${l}</button>`).join("")}</div>
   <a class="btn primary" id="fbMail" href="${esc(mail())}" style="text-align:center;text-decoration:none;padding:11px">Write an email</a>
   <div><div class="sub" style="margin-bottom:6px">No mail app? Copy the address instead:</div><div class="row" style="flex-wrap:nowrap"><span class="fbaddr" id="fbAddr">${esc(FEEDBACK_EMAIL)}</span><button class="btn" id="fbCopy">Copy</button></div></div>
   <div class="row"><span class="sub">Your habit data is never attached.</span><button class="btn" id="fbClose">Close</button></div></div></div>`;
  const close=()=>{root.innerHTML=""};document.getElementById("scrim").addEventListener("click",ev=>{if(ev.target.id==="scrim")close()});document.getElementById("fbClose").onclick=close;
  root.querySelectorAll("[data-fbt]").forEach(b=>b.onclick=()=>{type=b.dataset.fbt;root.querySelectorAll("[data-fbt]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.fbt===type));document.getElementById("fbMail").href=mail()});
  document.getElementById("fbMail").addEventListener("click",()=>setTimeout(close,400));
  document.getElementById("fbCopy").onclick=async()=>{const btn=document.getElementById("fbCopy");try{await navigator.clipboard.writeText(FEEDBACK_EMAIL);btn.textContent="Copied ✓"}catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("fbAddr"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);btn.textContent="Selected"}};
  document.addEventListener("keydown",function k(ev){if(ev.key==="Escape"){close();document.removeEventListener("keydown",k)}});
  document.getElementById("fbMail").focus()}

/* ---------- tour (coach marks) ---------- */
const TOUR=[
 {v:"today",sel:"#hero",t:"Your day at a glance",b:()=>on("schedule")?"The ring fills as you tick habits. The Now card shows the block you're in and what comes next.":"The ring fills as you tick habits, and shows how many are left for today."},
 {v:"today",sel:"#hlist",t:"Tap, hold or count",b:()=>"Tap a habit to tick it. Hold it (or tap ⋯) to skip with a reason or mark it missed; skips never break a streak. Counted habits, like glasses of water, use − and +."},
 {v:"habits",sel:"#habitsCard",t:"Your week in a grid",b:()=>"Every habit, every day, with its streak. Tap a square to tick it; hold it for skip or missed."},
 {v:"stats",sel:"#repcard, #statsEmpty",t:"Analytics & reports",b:()=>"Trends, a year heatmap and which habits lift the rest of your day. Download a PDF or a spreadsheet for any week, month or year."},
 {v:"today",sel:"#xpLink",mod:"rewards",t:"XP & rewards",b:()=>"Habits earn XP. Level up, grow your skills, then spend coins in a reward shop you fill with your own treats. Tap 🏆 any time."},
 {v:"edit",sel:"#t-edit",t:"Make it yours",b:()=>"Change habits, times and modules on Edit. “Run setup again” is there too if you want a different template."},
 {v:"sync",sel:"#t-sync",t:"Back up now and then",b:()=>"Your data stays on this phone only. Export a backup here every week or so, and before you ever delete the app."}];
let TS=null;
function tourSteps(){return TOUR.filter(s=>!s.mod||on(s.mod))}
function startTour(){closeTour();const sh=document.getElementById("sheetroot");if(sh)sh.innerHTML="";TS={i:0,steps:tourSteps()};showTourStep()}
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&TS)endTour()});
function closeTour(){const t=document.getElementById("tour");if(t)t.remove();window.removeEventListener("resize",placeTour);TS=null}
function endTour(){setMeta({tour:Date.now()});closeTour();if(view()!=="today")location.hash="#today"}
function showTourStep(){const st=TS.steps[TS.i];if(view()!==st.v){location.hash="#"+st.v;route()}
  const root=document.getElementById("overlayroot");let t=document.getElementById("tour");
  if(!t){t=document.createElement("div");t.id="tour";t.className="tour";t.innerHTML=`<div class="spot"></div><div class="bubble" role="dialog" aria-modal="true" aria-labelledby="tr-t"></div>`;root.appendChild(t);
    window.addEventListener("resize",placeTour)}
  const last=TS.i===TS.steps.length-1;
  t.querySelector(".bubble").innerHTML=`<span class="lbl">${TS.i+1} of ${TS.steps.length}</span><h3 id="tr-t">${st.t}</h3><p>${st.b()}</p><div class="row"><button class="btn ghost" id="trSkip">${last?"":"Skip tour"}</button><span class="nav">${TS.i?`<button class="btn" id="trBack">Back</button>`:""}<button class="btn primary" id="trNext">${last?"Done":"Next"}</button></span></div>`;
  t.querySelector("#trSkip").onclick=endTour;if(last)t.querySelector("#trSkip").style.visibility="hidden";
  const bk=t.querySelector("#trBack");if(bk)bk.onclick=()=>{TS.i--;showTourStep()};
  t.querySelector("#trNext").onclick=()=>{if(last)endTour();else{TS.i++;showTourStep()}};
  const el=document.querySelector(st.sel);if(el&&!el.closest("nav")){const sc=document.getElementById("scroller");const r=el.getBoundingClientRect(),sr=sc.getBoundingClientRect();
    const tgt=sc.scrollTop+(r.top-sr.top)-Math.max(12,(sr.height-Math.min(r.height,sr.height*0.45))/2*0.35);sc.scrollTop=Math.max(0,tgt)}
  requestAnimationFrame(()=>{placeTour();try{t.querySelector("#trNext").focus({preventScroll:true})}catch(e){}})}
function placeTour(){if(!TS)return;const t=document.getElementById("tour");if(!t)return;const st=TS.steps[TS.i];const el=document.querySelector(st.sel);const spot=t.querySelector(".spot"),bub=t.querySelector(".bubble");
  const vw=innerWidth,vh=innerHeight;const bw=Math.min(360,vw-32);bub.style.width=bw+"px";
  if(!el){spot.style.cssText="left:50%;top:40%;width:0;height:0";bub.style.left=(vw-bw)/2+"px";bub.style.top=Math.max(16,vh/2-bub.offsetHeight/2)+"px";return}
  const r=el.getBoundingClientRect();const p=6;let x=Math.max(4,r.left-p),y=Math.max(4,r.top-p),x2=Math.min(vw-4,r.right+p),y2=Math.min(vh-4,r.bottom+p);
  spot.style.cssText=`left:${x}px;top:${y}px;width:${x2-x}px;height:${y2-y}px`;
  const bh=bub.offsetHeight;let by;if(vh-y2>=bh+14)by=y2+10;else if(y>=bh+14)by=y-bh-10;else by=Math.max(12,vh-bh-90);
  const cx=(x+x2)/2;bub.style.left=Math.max(16,Math.min(vw-bw-16,cx-bw/2))+"px";bub.style.top=by+"px"}

/* ---------- shell ---------- */
const V=document.getElementById("view");const q=s=>V.querySelector(s)||document.querySelector(s);
const VIEWS={today:renderToday,habits:renderHabits,stats:renderStats,edit:renderEdit,sync:renderSync,rewards:renderRewards};
function view(){const v=(location.hash||"#today").slice(1);if(v==="rewards"&&!on("rewards"))return "today";return VIEWS[v]?v:"today"}
function renderPoints(){const g=game();document.getElementById("points").textContent=`Lv ${g.lvl.L} · ${g.coins.toLocaleString()} coins`;const n=H().length;const nm=CFG.profile&&CFG.profile.name;
  document.getElementById("subtitle").textContent=(nm?`Hi, ${nm}`+(n?" · ":""):"")+(n?`${n} habit${n===1?"":"s"}`:nm?" · let's set up your routine":"Let's set up your routine")}
function applyModsChrome(){const x=document.getElementById("xpLink");if(x)x.hidden=!on("rewards")}
function rerender(){const v=view();if((v==="edit"||v==="rewards")&&V.contains(document.activeElement)&&/INPUT|SELECT/.test(document.activeElement.tagName))return;if(v==="today"&&document.activeElement&&document.activeElement.id==="note")return;VIEWS[v]();if(TS)requestAnimationFrame(placeTour)}
function route(){const v=view();Object.keys(VIEWS).forEach(x=>{const a=document.getElementById("t-"+x);if(!a)return;if(x===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});renderPoints();VIEWS[v]();const sc=document.getElementById("scroller");if(sc)sc.scrollTop=0}
window.addEventListener("hashchange",route);
setInterval(()=>{if(view()==="today"&&!overlayOpen()&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))renderToday()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){dayView=null;if(!overlayOpen())rerender()}});
document.addEventListener("click",ev=>{const b=ev.target.closest&&ev.target.closest("[data-gm]");if(b&&view()==="stats"){CFG.manual=CFG.manual||{};CFG.manual[b.dataset.gm]=(+CFG.manual[b.dataset.gm]||0)+1;touchCfg();renderStats()}});
document.getElementById("fbBtn").addEventListener("click",()=>{if(!document.getElementById("wizard"))openFeedback()});
document.getElementById("helpBtn").addEventListener("click",()=>{if(!document.getElementById("wizard"))startTour()});
normalize(DEFAULT_CFG);normalize(CFG);lastLife=game().life;applyModsChrome();route();startSync();
if(!CFG.setupDone)openWizard(false);
if("serviceWorker" in navigator){
  const hadSW=!!navigator.serviceWorker.controller;let pending=false,done=false;
  const busy=()=>overlayOpen()||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  const reloadNow=()=>{if(done)return;if(busy()){pending=true;return}done=true;saveLocal();try{sessionStorage.setItem("levelup-pub-updated","1")}catch(e){}location.reload()};
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadSW)reloadNow()});
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    reg.update().catch(()=>{});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden){reg.update().catch(()=>{});if(pending)reloadNow()}});
    document.addEventListener("focusout",()=>{if(pending)setTimeout(reloadNow,300)});
    document.addEventListener("click",()=>{if(pending)setTimeout(reloadNow,300)});
  }).catch(()=>{}));
  try{if(sessionStorage.getItem("levelup-pub-updated")){sessionStorage.removeItem("levelup-pub-updated");setTimeout(()=>toast("Updated to Level Up "+APP_VERSION),400)}}catch(e){}
}
</script>
</body></html>
